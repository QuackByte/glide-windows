name: Release

# Pushing a tag like v0.6.0 builds both installers and attaches them to a draft release,
# to review, write notes for, and publish by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installers
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          foreach ($platform in 'x64', 'ARM64') {
            powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1 -Platform $platform -Version $version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Get-ChildItem artifacts\*-Setup.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File artifacts\SHA256SUMS.txt -Encoding ascii
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts\*-Setup.exe).FullName artifacts\SHA256SUMS.txt --draft --title "Glide for Windows $("${{ github.ref_name }}".TrimStart('v'))" --generate-notes
