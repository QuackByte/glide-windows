name: Release

# Pushing a tag like v0.7.0 builds both installers and attaches them to a draft release, with
# that version's CHANGELOG.md section as its notes, to review and publish by hand. Glide's updater
# only sees published releases.
#
# The installers aren't code-signed yet, so Windows SmartScreen warns on first run.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  installers:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      # The notes are this version's CHANGELOG.md section, the same text Glide shows after updating.
      - name: Release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $changelog = (Get-Content CHANGELOG.md -Raw -Encoding utf8) -replace "`r`n", "`n"
          $section = [regex]::Match($changelog, "(?ms)^## v?$([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $section.Success -or -not $section.Groups[1].Value.Trim()) {
            Write-Error "CHANGELOG.md has no entries for $version. Add a '## $version' section before tagging."
            exit 1
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @(
            $section.Groups[1].Value.Trim()
            ''
            '## Install'
            ''
            'Download the installer for your PC: **x64** for most PCs, **ARM64** for Snapdragon and other Arm PCs. It installs just for you, without administrator rights, and Glide keeps itself up to date from then on. Checksums are in `SHA256SUMS.txt`.'
            ''
            "This release isn't code-signed yet, so SmartScreen may warn the first time: choose **More info › Run anyway**."
          ) -join "`n" | Set-Content artifacts\release-notes.md -Encoding utf8
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          foreach ($platform in 'x64', 'ARM64') {
            powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1 -Platform $platform -Version $version -PublishOnly
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installers
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          foreach ($platform in 'x64', 'ARM64') {
            powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1 -Platform $platform -Version $version -PackageOnly
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts\*-Setup.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File artifacts\SHA256SUMS.txt -Encoding ascii
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts\*-Setup.exe).FullName artifacts\SHA256SUMS.txt --draft --title "Glide for Windows $version" --notes-file artifacts\release-notes.md
